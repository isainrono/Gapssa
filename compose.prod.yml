name: gapssa

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://gapssa.es}
        SITE_NOINDEX: ${SITE_NOINDEX:-false}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3050:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    env_file:
      - .env.production
    depends_on:
      apps-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gapssa-network
    volumes:
      - media-prod-data:/app/apps/web/media
      - media-root-prod-data:/app/media

  apps-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gapssa_cms}
      POSTGRES_USER: ${POSTGRES_USER:-gapssa_apps}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_AUTH_DB: ${POSTGRES_AUTH_DB:-gapssa_auth}
      POSTGRES_BOOKING_DB: ${POSTGRES_BOOKING_DB:-gapssa_booking}
    env_file:
      - .env.production
    volumes:
      - apps-db-prod-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - gapssa-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:8-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    env_file:
      - .env.production
    command: >-
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
    volumes:
      - redis-prod-data:/data
    networks:
      - gapssa-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  espocrm-db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${ESPOCRM_DB_NAME:-espocrm}
      MARIADB_USER: ${ESPOCRM_DB_USER:-espocrm}
      MARIADB_PASSWORD: ${ESPOCRM_DB_PASSWORD:-gapssa-espocrm-db-pass}
      MARIADB_ROOT_PASSWORD: ${ESPOCRM_DB_ROOT_PASSWORD:-gapssa-espocrm-root-pass}
    env_file:
      - .env.production
    volumes:
      - espocrm-db-prod-data:/var/lib/mysql
    networks:
      - gapssa-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  espocrm:
    image: espocrm/espocrm:10.0.3-apache-trixie
    environment:
      ESPOCRM_DATABASE_PLATFORM: Mysql
      ESPOCRM_DATABASE_HOST: espocrm-db
      ESPOCRM_DATABASE_NAME: ${ESPOCRM_DB_NAME:-espocrm}
      ESPOCRM_DATABASE_USER: ${ESPOCRM_DB_USER:-espocrm}
      ESPOCRM_DATABASE_PASSWORD: ${ESPOCRM_DB_PASSWORD:-gapssa-espocrm-db-pass}
      ESPOCRM_ADMIN_USERNAME: ${ESPOCRM_ADMIN_USERNAME:-admin}
      ESPOCRM_ADMIN_PASSWORD: ${ESPOCRM_ADMIN_PASSWORD:-Gapssa2026CrmAdmin!}
      ESPOCRM_SITE_URL: ${ESPOCRM_SITE_URL:-https://crm.gapssa.es}
      ESPOCRM_LANGUAGE: es_ES
      ESPOCRM_TIME_ZONE: Europe/Madrid
      ESPOCRM_DATE_FORMAT: DD/MM/YYYY
      ESPOCRM_TIME_FORMAT: HH:mm
      ESPOCRM_WEEK_START: 1
      ESPOCRM_DEFAULT_CURRENCY: EUR
    env_file:
      - .env.production
    volumes:
      - espocrm-data-prod-data:/var/www/html/data
      - espocrm-custom-prod-data:/var/www/html/custom
      - espocrm-client-custom-prod-data:/var/www/html/client/custom
    networks:
      - gapssa-network
    ports:
      - "127.0.0.1:8081:80"
    restart: unless-stopped
    depends_on:
      espocrm-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bin/command", "app-check"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 60s

  espocrm-daemon:
    image: espocrm/espocrm:10.0.3-apache-trixie
    entrypoint: docker-daemon.sh
    environment:
      ESPOCRM_DATABASE_PLATFORM: Mysql
      ESPOCRM_DATABASE_HOST: espocrm-db
      ESPOCRM_DATABASE_NAME: ${ESPOCRM_DB_NAME:-espocrm}
      ESPOCRM_DATABASE_USER: ${ESPOCRM_DB_USER:-espocrm}
      ESPOCRM_DATABASE_PASSWORD: ${ESPOCRM_DB_PASSWORD:-gapssa-espocrm-db-pass}
    env_file:
      - .env.production
    volumes_from:
      - espocrm
    networks:
      - gapssa-network
    restart: unless-stopped
    depends_on:
      espocrm:
        condition: service_healthy

  espocrm-websocket:
    image: espocrm/espocrm:10.0.3-apache-trixie
    entrypoint: docker-websocket.sh
    environment:
      ESPOCRM_CONFIG_USE_WEB_SOCKET: "true"
      ESPOCRM_CONFIG_WEB_SOCKET_URL: "wss://crm.gapssa.es/ws"
      ESPOCRM_CONFIG_WEB_SOCKET_ZERO_M_Q_SUBSCRIBER_DSN: "tcp://*:7777"
      ESPOCRM_CONFIG_WEB_SOCKET_ZERO_M_Q_SUBMISSION_DSN: "tcp://espocrm-websocket:7777"
    env_file:
      - .env.production
    volumes_from:
      - espocrm
    networks:
      - gapssa-network
    ports:
      - "127.0.0.1:8083:8080"
    restart: unless-stopped
    depends_on:
      espocrm:
        condition: service_healthy

networks:
  gapssa-network:
    driver: bridge

volumes:
  apps-db-prod-data:
  redis-prod-data:
  media-prod-data:
  media-root-prod-data:
  espocrm-db-prod-data:
  espocrm-data-prod-data:
  espocrm-custom-prod-data:
  espocrm-client-custom-prod-data:
