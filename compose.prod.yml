name: gapssa-prod

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://gapssa.es}
        SITE_NOINDEX: ${SITE_NOINDEX:-false}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3050:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    env_file:
      - .env.production
    depends_on:
      apps-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gapssa-network
    volumes:
      - media-prod-data:/app/apps/web/media
      - media-root-prod-data:/app/media

  apps-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gapssa_cms}
      POSTGRES_USER: ${POSTGRES_USER:-gapssa_apps}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_AUTH_DB: ${POSTGRES_AUTH_DB:-gapssa_auth}
      POSTGRES_BOOKING_DB: ${POSTGRES_BOOKING_DB:-gapssa_booking}
    env_file:
      - .env.production
    volumes:
      - apps-db-prod-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - gapssa-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:8-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    env_file:
      - .env.production
    command: >-
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
    volumes:
      - redis-prod-data:/data
    networks:
      - gapssa-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  gapssa-network:
    driver: bridge

volumes:
  apps-db-prod-data:
  redis-prod-data:
  media-prod-data:
  media-root-prod-data:
