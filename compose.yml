name: ${COMPOSE_PROJECT_NAME:-gapssa}

services:
  espocrm-db:
    image: ${ESPOCRM_DB_IMAGE}
    environment:
      MARIADB_DATABASE: ${ESPOCRM_DB_NAME}
      MARIADB_USER: ${ESPOCRM_DB_USER}
      MARIADB_PASSWORD: ${ESPOCRM_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${ESPOCRM_DB_ROOT_PASSWORD}
    volumes:
      - espocrm-db:/var/lib/mysql
    networks:
      - private
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  espocrm:
    image: ${ESPOCRM_IMAGE}
    environment:
      ESPOCRM_DATABASE_PLATFORM: Mysql
      ESPOCRM_DATABASE_HOST: espocrm-db
      ESPOCRM_DATABASE_NAME: ${ESPOCRM_DB_NAME}
      ESPOCRM_DATABASE_USER: ${ESPOCRM_DB_USER}
      ESPOCRM_DATABASE_PASSWORD: ${ESPOCRM_DB_PASSWORD}
      ESPOCRM_ADMIN_USERNAME: ${ESPOCRM_ADMIN_USERNAME}
      ESPOCRM_ADMIN_PASSWORD: ${ESPOCRM_ADMIN_PASSWORD}
      ESPOCRM_SITE_URL: ${ESPOCRM_SITE_URL}
      ESPOCRM_LANGUAGE: es_ES
      ESPOCRM_TIME_ZONE: Europe/Madrid
      ESPOCRM_DATE_FORMAT: DD/MM/YYYY
      ESPOCRM_TIME_FORMAT: HH:mm
      ESPOCRM_WEEK_START: 1
      ESPOCRM_DEFAULT_CURRENCY: EUR
    volumes:
      - espocrm-data:/var/www/html/data
      - espocrm-custom:/var/www/html/custom
      - espocrm-client-custom:/var/www/html/client/custom
    networks:
      - public
      - private
    ports:
      - "${ESPOCRM_HTTP_PORT}:80"
    restart: unless-stopped
    depends_on:
      espocrm-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bin/command", "app-check"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 60s

  espocrm-daemon:
    image: ${ESPOCRM_IMAGE}
    entrypoint: docker-daemon.sh
    environment:
      ESPOCRM_DATABASE_PLATFORM: Mysql
      ESPOCRM_DATABASE_HOST: espocrm-db
      ESPOCRM_DATABASE_NAME: ${ESPOCRM_DB_NAME}
      ESPOCRM_DATABASE_USER: ${ESPOCRM_DB_USER}
      ESPOCRM_DATABASE_PASSWORD: ${ESPOCRM_DB_PASSWORD}
    volumes_from:
      - espocrm
    networks:
      - public
      - private
    restart: unless-stopped
    depends_on:
      espocrm:
        condition: service_healthy

  espocrm-websocket:
    image: ${ESPOCRM_IMAGE}
    entrypoint: docker-websocket.sh
    environment:
      ESPOCRM_CONFIG_USE_WEB_SOCKET: "true"
      ESPOCRM_CONFIG_WEB_SOCKET_URL: "ws://localhost:${ESPOCRM_WEBSOCKET_PORT}"
      ESPOCRM_CONFIG_WEB_SOCKET_ZERO_M_Q_SUBSCRIBER_DSN: "tcp://*:7777"
      ESPOCRM_CONFIG_WEB_SOCKET_ZERO_M_Q_SUBMISSION_DSN: "tcp://espocrm-websocket:7777"
    volumes_from:
      - espocrm
    networks:
      - public
      - private
    ports:
      - "${ESPOCRM_WEBSOCKET_PORT}:8080"
    restart: unless-stopped
    depends_on:
      espocrm:
        condition: service_healthy

  # ---- Fase 1: base de plataforma del portal (apps/web + Payload) ----
  #
  # Postgres y Redis viven en "apps-private", nunca en "public"
  # (docs/contratos-portal-v1.md exige que ninguna base de datos sea
  # accesible desde la red pública) y nunca en la "private" de EspoCRM
  # (redes separadas por servicio, no una única "private" compartida).
  #
  # "apps-private" NO es "internal: true", a diferencia de "private": se
  # comprobó en el arranque real que Docker no aplica la publicación de
  # puertos al host (127.0.0.1:...) en absoluto para contenedores cuya
  # única red es "internal" — el mapeo queda declarado pero nunca se activa
  # (verificado con `docker inspect`: HostConfig.PortBindings lo declara,
  # NetworkSettings.Ports queda vacío). apps/web corre con `next dev` en el
  # host, no en un contenedor, durante el desarrollo local, y necesita
  # alcanzar Postgres/Redis: por eso esta red permite el mapeo de puertos.
  # Sigue sin ser "public": el puerto publicado se ata solo a 127.0.0.1
  # (nunca 0.0.0.0), así que no es alcanzable desde fuera de esta máquina,
  # y "apps-private" nunca se une a la red "public" ni a "private". La
  # contrapartida documentada: a diferencia de "private" (sin salida a
  # Internet), los contenedores de "apps-private" sí podrían iniciar
  # conexiones salientes — aceptable en desarrollo local, a revisar si esta
  # topología se lleva a producción (Fase 7).
  apps-db:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Leídas por infra/postgres/init/001-create-databases.sh — nombres
      # configurables, no hardcodeados en el script de inicialización.
      POSTGRES_AUTH_DB: ${POSTGRES_AUTH_DB}
      POSTGRES_BOOKING_DB: ${POSTGRES_BOOKING_DB}
    volumes:
      # Postgres 18+ espera un único punto de montaje en /var/lib/postgresql
      # (no en .../data): guarda los datos en un subdirectorio con el
      # nombre de la versión mayor, pensado para pg_upgrade --link.
      # Verificado contra el arranque real de la imagen: montar en
      # .../data como en versiones anteriores hace que el contenedor se
      # niegue a arrancar.
      - apps-db-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - apps-private
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: ${REDIS_IMAGE}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: >-
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - apps-private
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT}:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  public:
  private:
    internal: true
  apps-private:

volumes:
  espocrm-db:
  espocrm-data:
  espocrm-custom:
  espocrm-client-custom:
  apps-db-data:
  redis-data:

